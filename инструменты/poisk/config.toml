# Настройки поиска упоминаний в сканах газет.
# Пути относительны к папке этого файла.

work_dir = "работа"   # база, вырезки, отчёты, тексты

[models]
# Первый проход: много дешёвых запросов (каждая плитка каждой страницы).
scan = "claude-haiku-5-5"
scan_effort = "medium"
# Проверка найденного: мало запросов, нужна точность.
verify = "claude-opus-5-5"
verify_effort = "medium"
# Полная расшифровка выбранных страниц (команда transcribe).
transcribe = "claude-sonnet-5-5"
transcribe_effort = "low"
# Серверный запасной вариант при отказе модели (для Opus 5.5 / Sonnet 5.5 / Fable).
fallbacks = true

[tiles]
# Плитки вырезаются из скана в исходном разрешении, без пересжатия.
width = 1200
height = 1000
# Горизонтальное перекрытие должно быть больше ширины самой широкой колонки
# (1905: ~350 px, 1892: ~600 px), тогда каждая строка целиком попадает хотя бы в одну плитку.
overlap_x = 650
# Вертикальное перекрытие — несколько строк (перенос слова «Вѣт-ка» на две строки).
overlap_y = 150
jpeg_quality = 85
autocontrast = true

[transcribe]
band_height = 900
band_overlap = 150

[run]
workers = 8            # одновременных запросов в обычном режиме
batch_max_mb = 150     # размер одного пакета Batch API (лимит API — 256 МБ)

# Цены, $ за 1M токенов [вход, выход] — только для оценки расходов.
# Batch API считается со скидкой 50%.
[prices]
"claude-haiku-5-5" = [0.10, 0.50]
"claude-sonnet-5-5" = [2.00, 10.00]
"claude-sonnet-5" = [2.00, 10.00]
"claude-opus-5-5" = [4.00, 20.00]

# Что ищем. id — короткое имя объекта (как в колонке «объект» ваших CSV),
# aliases — другие значения колонки «объект», которые считаются тем же объектом (для eval).
[[target]]
id = "Ветка"
aliases = ["Ветковская волость", "Имение Ветка"]
description = "местечко (город) Ветка Гомельского уезда и всё производное: Ветковская волость, Ветковское общество, ветковский мещанин/купец/староста, имение Ветка"
forms = ["Вѣтка", "Вѣтки", "Вѣткѣ", "Вѣтку", "Вѣткою", "Вѣтковскій", "Вѣтковская", "Вѣтковское", "Вѣтковскаго", "Вѣтковскимъ", "Ветка", "Ветковская"]

[[target]]
id = "Грошиков"
description = "фамилия Грошиков (любые Грошиковы, в т. ч. «онъ же Грошиковъ»), особенно Тимофей Грошиков, купец 2-й гильдии"
forms = ["Грошиковъ", "Грошикова", "Грошикову", "Грошиковымъ", "Грошиковы", "Грошиковыхъ"]

[[target]]
id = "Рубанов"
description = "фамилия Рубанов (любые Рубановы), особенно И. Т. Рубанов"
forms = ["Рубановъ", "Рубанова", "Рубанову", "Рубановымъ", "Рубановы", "Рубановыхъ"]

# Пример: населённые пункты Ветковской волости. Названия частые (Новоселки есть
# во многих уездах), поэтому ложных находок будет много — включайте по необходимости.
# [[target]]
# id = "Ветковская волость (сёла)"
# description = "населённые пункты Ветковской волости Гомельского уезда: слобода Тарасовка, с. Новосёлки, слобода Марьина"
# forms = ["Тарасовка", "Новоселки", "Марьина"]
